# dotclaude:managed — regenerated by /dotclaude:init. To take local ownership, delete this line.
name: Claude Code Review

# Auto-runs on every new PR (and every push that updates a PR) so a
# human-style review from Claude is available without anyone having to
# remember to invoke it manually. The Copilot Pull Request Reviewer
# (GitHub App) and chatgpt-codex-connector also auto-review; see
# CLAUDE.md § "Agent workflow rules" for the full convention.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  claude-review:
    # Skip drafts, forks (no secret access), and Dependabot (read-only
    # token; the action needs CLAUDE_CODE_OAUTH_TOKEN which Dependabot
    # PRs can't see, so the run would fail and leave a red check).
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review (Jonathan Haraldsson)
        id: claude-review
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Run Claude Code Review (j.haraldsson94@gmail.com fallback)
        if: steps.claude-review.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_JH }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
